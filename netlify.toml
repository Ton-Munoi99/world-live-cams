# เว็บ static ล้วน ไม่ต้อง build
# publish ต้องไม่ใช่รากโปรเจกต์ ไม่งั้นโฟลเดอร์ netlify/ จะถูกมองเป็นไฟล์เว็บ
[build]
  publish = "public"
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# กันเว็บด้วยรหัสผ่าน — เช็คที่ edge ก่อนส่งไฟล์ (ตั้ง SITE_PASSWORD ใน Netlify)
[[edge_functions]]
  path = "/*"
  function = "auth"
